# GoReleaser v2 configuration.
# The release workflow pins `version: latest`, which rejects v0/v1 configs.
version: 2

project_name: dockrouter

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildTime={{.Date}}
      - -X main.commit={{.Commit}}
    main: ./cmd/dockrouter

archives:
  # The dashboard is embedded in the binary via go:embed, so it is not shipped
  # as a separate archive entry.
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: DockRouter
    name: dockrouter
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
